[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "verdict"
version = "0.1.0"
description = "Real-time fraud and risk decisioning platform: streaming feature store, point-in-time correctness, shadow deployment, drift-triggered retraining, expected-loss review queue"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Peter Parker" }]

# Every pin is a major version with a reason. Minor and patch float so security
# fixes arrive without a commit; majors do not move without an ADR.
dependencies = [
  # Wire schema and validation. v2 is the rewritten core; v1 has a different
  # API surface and is end of life, so the major is pinned and the model
  # definitions in events/schema.py assume v2 semantics.
  "pydantic>=2.11,<3",
  # The generator's entity sampling and amount distributions. v2 changed the
  # copy/promotion rules and the Generator API this code relies on.
  "numpy>=2.2,<3",
  # CLI. Pre-1.0, so the minor is pinned too: Typer still changes argument
  # handling between minors.
  "typer>=0.15,<0.16",
]

[project.optional-dependencies]
dev = [
  # Test runner. v8 is the current major; v9 will change collection hooks.
  "pytest>=8.3,<9",
  # Coverage of the tests that are meant to fail meaningfully.
  "pytest-cov>=6.0,<7",
  # Property-based tests for generator determinism and schema round-trips.
  # Pre-1.0 but stable in practice; major pinned at 6.
  "hypothesis>=6.122,<7",
  # Type checking, --strict in CI. Pre-2.0; new minors add checks, which is
  # wanted, so only the major is pinned.
  "mypy>=1.14,<2",
  # Lint and format. Pre-1.0 and moves fast, so the minor is pinned and
  # raised deliberately.
  "ruff>=0.9,<0.10",
]

[project.scripts]
verdict = "verdict.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["verdict"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "SIM", "RUF", "ANN", "D"]
ignore = [
  "D203",  # conflicts with D211
  "D213",  # conflicts with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103", "ANN201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
disallow_any_explicit = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: throughput and load measurements, excluded from the fast suite",
]
