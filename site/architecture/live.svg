<svg xmlns="http://www.w3.org/2000/svg" width="1262" height="584" viewBox="0 0 1262 584" role="img" aria-label="Terraform from the laptop stands up an auto-scaling group of one in AWS ca-central-1 that boots the pushed image, keeps history and saved feature state on an EBS volume, serves the dashboard through a Cloudflare tunnel, emails alerts through SNS and opens its retraining and promotion verdicts as pull requests a person merges." font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
