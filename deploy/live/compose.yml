# The live stack, on the one instance (deploy/terraform). The boot script
# writes this file to /opt/verdict/compose.yml and starts it.
#
# It differs from the local stack (deploy/compose/docker-compose.yml) in
# three ways, each on purpose:
#   - no port is published: nothing outside the instance talks to the broker,
#     and the dashboard leaves through the Cloudflare Tunnel;
#   - the broker's data lives on the data volume at /data, which outlives the
#     instance;
#   - retentions are sized to the disk (ADR 14), not to a laptop.
# Topic names and partition counts must match the local stack exactly, and
# tests/test_live_stack.py asserts that they do.
#
# The platform's own services all run one image, `verdict`, with different
# commands; VERDICT_IMAGE names it (the boot script writes it from the
# Terraform variable `image_tag`), along with the window's start and schedule.
# The two feeds play the generator in real time and resume from their saved
# place after a spot replacement (ADR 15). Grafana serves the public
# dashboard through the tunnel, read-only and anonymous.

name: verdict

services:
  redpanda:
    image: redpandadata/redpanda:v24.3.6
    container_name: verdict-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:9092
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    configs:
      - source: redpanda-bootstrap
        target: /etc/redpanda/.bootstrap.yaml
    volumes:
      - /data/redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # Run by the boot script with `run --rm`, never by `up`: see the profile.
  # Idempotent, as the local one is, because every replacement instance runs
  # it again against topics that already exist on the data volume.
  topics:
    image: redpandadata/redpanda:v24.3.6
    profiles: [setup]
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        ensure() {
          if rpk topic describe "$$1" --brokers redpanda:9092 >/dev/null 2>&1; then
            found=$$(rpk topic describe "$$1" --brokers redpanda:9092 -p | grep -c '^[0-9]')
            test "$$found" -eq "$$2" || { echo "$$1 has $$found partitions, expected $$2"; exit 1; }
            rpk topic alter-config "$$1" --brokers redpanda:9092 --set retention.ms="$$3"
            echo "$$1 exists with $$2 partitions"
          else
            rpk topic create "$$1" --brokers redpanda:9092 \
              --partitions "$$2" --replicas 1 --topic-config retention.ms="$$3"
          fi
        }
        # A day each (ADR 18). The topics are buffers: what the platform
        # keeps is staged by the scorer and the label collector as it goes,
        # and reduced to a weighted sample once labels are in. A day of
        # transactions is also the longest window a feature reads (24 hours),
        # which is what a replacement instance replays to rebuild its state;
        # the broker deletes whole segments, so a little more than a day is
        # always there.
        ensure transactions 1 86400000
        ensure labels 1 86400000
        ensure decisions 4 86400000
        ensure shadow 4 86400000
        # Thirty days: read by a person, and small.
        ensure dead-letter 1 2592000000
        rpk topic list --brokers redpanda:9092
        test "$$(rpk cluster config get auto_create_topics_enabled -X admin.hosts=redpanda:9644)" = false
    restart: "no"

  # The decision path (ADR 8), staging every decision with its features
  # before the checkpoint (ADR 18). Metrics listen inside the stack's network
  # only; nothing publishes the port.
  scorer:
    image: ${VERDICT_IMAGE:?the boot script writes it to /etc/verdict/stack.env}
    container_name: verdict-scorer
    command:
      - score
      - --bootstrap=redpanda:9092
      - --history=/data/history
      - --metrics-host=0.0.0.0
      - --metrics-port=9108
      # The champion pointer, on the volume so a rollback survives a
      # replacement. Started at the shipped champion only if it does not exist.
      - --flag=/data/flags/champion.json
      - --initial-champion=champion
    depends_on:
      redpanda:
        condition: service_healthy
    volumes:
      - /data/history:/data/history
      - /data/flags:/data/flags
    # A stop never splits a batch (scoring/service.py); give it time to finish.
    stop_grace_period: 30s
    restart: unless-stopped

  # Labels off the stream into the label spool, before the topic's day ends.
  labels:
    image: ${VERDICT_IMAGE:?the boot script writes it to /etc/verdict/stack.env}
    container_name: verdict-labels
    command:
      - history
      - labels
      - --root=/data/history
      - --bootstrap=redpanda:9092
      - --metrics-host=0.0.0.0
      - --metrics-port=9111
    depends_on:
      redpanda:
        condition: service_healthy
    volumes:
      - /data/history:/data/history
    restart: unless-stopped

  # The generator in real time: each transaction when its event time comes,
  # each label a week later. Same configuration, two runs (ADR 15). Their
  # saved places are on the data volume; the sealed schedule's secret and
  # commitment are files the boot script writes, mounted read-only.
  feed-transactions:
    image: ${VERDICT_IMAGE:?the boot script writes it to /etc/verdict/stack.env}
    container_name: verdict-feed-transactions
    command:
      - live
      - transactions
      - --state=/data/feeds
      - --start=${VERDICT_WINDOW_START:?the boot script writes it}
      - --schedule=${VERDICT_SCHEDULE:?the boot script writes it}
      - --bootstrap=redpanda:9092
      - --metrics-host=0.0.0.0
      - --metrics-port=9109
      - --secret-file=/run/schedule/secret
      - --commitment-file=/run/schedule/commitment.json
    depends_on:
      redpanda:
        condition: service_healthy
    volumes:
      - /data/feeds:/data/feeds
      - /etc/verdict/schedule:/run/schedule:ro
    restart: unless-stopped

  feed-labels:
    image: ${VERDICT_IMAGE:?the boot script writes it to /etc/verdict/stack.env}
    container_name: verdict-feed-labels
    command:
      - live
      - labels
      - --state=/data/feeds
      - --start=${VERDICT_WINDOW_START:?the boot script writes it}
      - --schedule=${VERDICT_SCHEDULE:?the boot script writes it}
      - --bootstrap=redpanda:9092
      - --metrics-host=0.0.0.0
      - --metrics-port=9110
      - --secret-file=/run/schedule/secret
      - --commitment-file=/run/schedule/commitment.json
    depends_on:
      redpanda:
        condition: service_healthy
    volumes:
      - /data/feeds:/data/feeds
      - /etc/verdict/schedule:/run/schedule:ro
    restart: unless-stopped

  # Seal finished hours and finalise days whose labels are in, every five
  # minutes, at most a few hours a run (--seal-limit, default 4), each hour
  # streamed a chunk at a time. On 2026-09-22 a run working off the backlog
  # that spot reclaims had left sealed twelve hours in one process, holding
  # each whole, and was killed by the kernel at 9.3 GB (docs/STATE.md).
  # Each run is still its own process; the parent outlives them and reports
  # how they ended and how far behind the spools are (ADR 26).
  compactor:
    image: ${VERDICT_IMAGE:?the boot script writes it to /etc/verdict/stack.env}
    container_name: verdict-compactor
    command:
      - history
      - compactor
      - --root=/data/history
      - --every=300
      - --metrics-host=0.0.0.0
      - --metrics-port=9112
    volumes:
      - /data/history:/data/history
    restart: unless-stopped

  # Firing alerts into an outbox on the volume; the host sends them (ADR 26).
  alerts:
    image: ${VERDICT_IMAGE:?the boot script writes it to /etc/verdict/stack.env}
    container_name: verdict-alerts
    command: [observe, alerts]
    depends_on:
      - prometheus
    volumes:
      - /data/alerts:/data/alerts
    restart: unless-stopped

  # Scrapes the scorer. Its data is on the volume so a replacement keeps the
  # window's history of latency. Kept 75 days: the live report (ADR 25) is
  # computed from it after the sixty-day window ends.
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: verdict-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=75d
      # The dashboard is public, and a viewer's panel is a query. Bounded, so
      # nobody can make this instance spend its CPU on someone else's query.
      - --query.timeout=10s
      - --query.max-samples=5000000
      - --query.max-concurrency=4
    configs:
      - source: prometheus
        target: /etc/prometheus/prometheus.yml
      - source: alert-rules
        target: /etc/prometheus/rules.yml
    volumes:
      - /data/prometheus:/prometheus
    restart: unless-stopped

  # Writes Grafana's provisioning (data source, dashboard) from the image,
  # where the dashboard is code with a test on every query (verdict/observe).
  # Run by the boot script with `run --rm`, like the topics job.
  grafana-files:
    image: ${VERDICT_IMAGE:?the boot script writes it to /etc/verdict/stack.env}
    profiles: [setup]
    command: [observe, grafana, --out=/grafana, --mounted-at=/etc/grafana/verdict]
    volumes:
      - /data/grafana:/grafana
    restart: "no"

  # The public dashboard, reached only through the tunnel. Anonymous viewers
  # see the one provisioned dashboard; nobody can log in, sign up, explore,
  # share a snapshot or edit. The admin password is random per boot and
  # written nowhere but the root-only env file, because nobody needs it.
  grafana:
    image: grafana/grafana:13.2.2
    container_name: verdict-grafana
    environment:
      GF_PATHS_PROVISIONING: /etc/grafana/verdict/provisioning
      GF_SERVER_ROOT_URL: https://risk.peterparker.ca
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?the boot script writes it}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_EXPLORE_ENABLED: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_PUBLIC_DASHBOARDS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/verdict/dashboards/verdict.json
    volumes:
      - /data/grafana:/etc/grafana/verdict:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  # The dashboard's way out. It dials Cloudflare; nothing dials in. The token
  # comes from SSM through the boot script's env file, never from this file.
  cloudflared:
    image: cloudflare/cloudflared:2026.9.1
    container_name: verdict-cloudflared
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?the boot script writes it to /etc/verdict/tunnel.env}
    restart: unless-stopped

configs:
  redpanda-bootstrap:
    content: |
      auto_create_topics_enabled: false
  prometheus:
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 30s
      rule_files: [/etc/prometheus/rules.yml]
      scrape_configs:
        - job_name: scorer
          static_configs:
            - targets: ["scorer:9108"]
        - job_name: feeds
          static_configs:
            - targets: ["feed-transactions:9109", "feed-labels:9110"]
        - job_name: labels
          static_configs:
            - targets: ["labels:9111"]
        - job_name: compactor
          static_configs:
            - targets: ["compactor:9112"]
  # What reaches Peter by email (ADR 26): Prometheus evaluates these, and the
  # relay on the host (deploy/live/alert-relay.sh) sends each one that fires,
  # and its end, to the verdict-alerts topic. docs/failure-modes.md has what
  # each means and what to do.
  alert-rules:
    content: |
      groups:
        - name: verdict
          rules:
            # The labels topic keeps a day; a collector further behind than
            # that has lost labels for good. Two hours leaves most of the day.
            - alert: LabelCollectorBehind
              expr: >-
                max(verdict_feed_latest_due_timestamp_seconds{feed="labels"})
                - max(verdict_labels_latest_label_timestamp_seconds) > 7200
              for: 15m
              annotations:
                summary: The label collector is over two hours behind the labels feed.
            # An hour is sealed about ten minutes after it ends (labels: after
            # the next hour's labels have come too), so three hours is runs
            # failing or not happening.
            - alert: HistoryUnsealed
              expr: max(verdict_history_unsealed_age_seconds) > 10800
              for: 15m
              annotations:
                summary: An hour of history ended over three hours ago and is still unsealed.
            - alert: DayNotFinalised
              expr: max(verdict_history_finalisable_days) > 0
              for: 1h
              annotations:
                summary: A day has had all its labels for over an hour and is not final.
            - alert: CompactionFailing
              expr: increase(verdict_history_compact_runs_total{outcome="failed"}[30m]) >= 3
              annotations:
                summary: Three or more compaction runs failed in half an hour.
            - alert: ScorerStopped
              expr: time() - verdict_last_decision_timestamp_seconds > 900
              for: 5m
              annotations:
                summary: The scorer has decided nothing for over fifteen minutes.
            # A spot replacement takes about four minutes, so ten is not one.
            - alert: TargetDown
              expr: up == 0
              for: 10m
              annotations:
                summary: A service Prometheus scrapes has been unreachable for ten minutes.
