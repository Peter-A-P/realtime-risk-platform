name: ci

# Lint, types and tests on every push and pull request. The slow marker holds
# the throughput measurement, which runs here too: a generator that cannot
# outrun the live rate is a finding, not a flaky test.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Types
        run: mypy verdict tests

      - name: Tests
        run: pytest -q -m "not slow and not broker"

      - name: Stream contract on Redpanda
        # The same compose file the laptop runs, so a broken stack fails here
        # rather than on the next person's first `up`. Brought up twice: the
        # second `up` is the restart that once failed on existing topics.
        run: |
          docker compose -f deploy/compose/docker-compose.yml up -d --wait redpanda
          docker compose -f deploy/compose/docker-compose.yml run --rm topics
          docker compose -f deploy/compose/docker-compose.yml run --rm topics
          pytest -q -m broker
          docker compose -f deploy/compose/docker-compose.yml down -v

      - name: Throughput
        # Separated so a slow runner reads as a throughput result rather than
        # as a failure somewhere in the suite.
        run: pytest -q -m slow

  terraform:
    # The live stack's configuration, checked without an AWS account: format,
    # and a validate that type-checks every resource against the provider.
    # Nothing here plans or applies; that needs the deploy identity.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.3"

      - name: Format
        run: terraform -chdir=deploy/terraform fmt -check -recursive

      - name: Validate
        run: |
          terraform -chdir=deploy/terraform init -backend=false -input=false
          terraform -chdir=deploy/terraform validate

  image:
    # The image every platform service on the live stack runs. Built here so
    # a broken Dockerfile fails on push, not on the instance at boot; not
    # pushed anywhere (deploy/push-image.sh does that, from a clean commit).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -f deploy/image/Dockerfile -t verdict:ci .

      - name: Runs, as its own unprivileged user
        run: |
          docker run --rm verdict:ci --help
          docker run --rm verdict:ci history --help
          test "$(docker run --rm --entrypoint id verdict:ci -u)" = 10001
